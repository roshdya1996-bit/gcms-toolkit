[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gcms-toolkit"
version = "0.1.0"
description = "Small helpers for GC-MS/MS food additive analysis: retention indices and MRM transition lists"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Roshdy Adel Mohamed Gharib" }]
keywords = ["gc-ms", "gc-ms/ms", "mrm", "food additives", "preservatives", "phthalates", "retention index"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gcms_toolkit = ["py.typed"]
